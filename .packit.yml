---
# SPDX-License-Identifier: LGPL-2.1-or-later
# Docs: https://packit.dev/docs/
#
# Branch s390x-sysdemd: diagnostic-only .packit.yml that builds ONLY on
# fedora-rawhide-s390x and dumps meson-logs/testlog.txt on %check failure
# so the SIGABRT backtraces are visible in builder-live.log.

specfile_path: .packit_rpm/systemd.spec
files_to_sync:
  - .packit.yml
  - src: .packit_rpm/systemd.spec
    dest: systemd.spec
upstream_tag_template: "v{version}"
srpm_build_deps: []

actions:
  get-current-version:
    - cat meson.version

  post-upstream-clone:
    - git clone https://src.fedoraproject.org/rpms/systemd .packit_rpm
    - bash -c 'git -C .packit_rpm checkout "$(grep GIT_COMMIT= mkosi/mkosi.pkgenv/mkosi.conf.d/centos-fedora.conf | cut -d= -f2)"'
    - bash -c 'echo "%bcond upstream 1" > .packit_rpm/systemd.spec.new'
    - bash -c 'echo "%define meson_extra_configure_options --werror" >> .packit_rpm/systemd.spec.new'
    - bash -c 'cat .packit_rpm/systemd.spec >> .packit_rpm/systemd.spec.new'
    - mv .packit_rpm/systemd.spec.new .packit_rpm/systemd.spec
    # Inject a testlog dump into %check so SIGABRT backtraces end up in
    # builder-live.log. The trap fires on any %check exit path (success or
    # failure); the file may not exist if meson configure failed, hence "|| true".
    - bash -c 'sed -i "0,/^%check$/s||%check\ntrap '\''cat %{_vpath_builddir}/meson-logs/testlog.txt 2>/dev/null \|\| true'\'' EXIT|" .packit_rpm/systemd.spec'

jobs:
- job: copr_build
  trigger: commit
  branch: s390x-sysdemd
  targets:
  - fedora-rawhide-s390x
