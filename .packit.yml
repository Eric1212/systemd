---
# SPDX-License-Identifier: LGPL-2.1-or-later
# Docs: https://packit.dev/docs/
#
# Branch s390x-sysdemd: aggressive diag + fix validation for
# fedora-rawhide-s390x only. Builds a minimal systemd (tests only),
# runs only the 15 previously failing tests with timeout-multiplier=4,
# and dumps meson-logs/testlog.txt to builder-live.log so per-test
# stderr/backtraces are visible.
#
# This aggressive setup cuts copr cycle time from ~4h to ~1h30 by:
#   - disabling every subsystem not touched by the 15 tests
#   - compiling only the 15 test binaries (not all of systemd)
#   - skipping %install entirely
#   - running only those 15 tests in %check

specfile_path: .packit_rpm/systemd.spec
files_to_sync:
  - .packit.yml
  - src: .packit_rpm/systemd.spec
    dest: systemd.spec
upstream_tag_template: "v{version}"
srpm_build_deps: []

actions:
  get-current-version:
    - cat meson.version

  post-upstream-clone:
    - git clone https://src.fedoraproject.org/rpms/systemd .packit_rpm
    - bash -c 'git -C .packit_rpm checkout "$(grep GIT_COMMIT= mkosi/mkosi.pkgenv/mkosi.conf.d/centos-fedora.conf | cut -d= -f2)"'
    - bash -c 'echo "%bcond upstream 1" > .packit_rpm/systemd.spec.new'
    - bash -c 'echo "%define ntpvendor fedora" >> .packit_rpm/systemd.spec.new'
    - bash -c 'echo "%define meson_extra_configure_options --werror -Dman=disabled -Dhtml=disabled -Dukify=disabled -Dvmspawn=disabled -Dnspawn=disabled -Dhomed=disabled -Dimportd=disabled -Dsysupdate=disabled -Dsysupdated=disabled -Dremote=disabled -Drepart=disabled -Dlibcryptsetup=disabled -Dlibfido2=disabled -Dlibcurl=disabled -Dbootloader=disabled -Dxkbcommon=disabled -Dpolkit=disabled -Dgnutls=disabled -Dlibidn2=disabled -Dmicrohttpd=disabled -Dp11kit=disabled -Dpcre2=disabled -Dportabled=false -Dpstore=false -Dhwdb=false -Doomd=false -Dsysext=false -Dquotacheck=false -Drfkill=false -Dbacklight=false -Dhibernate=false -Dxdg-autostart=false -Dcoredump=false -Dlogind=false -Dmachined=true -Dtimesyncd=false -Dtimedated=false -Dlocaled=true -Dhostnamed=false -Dvconsole=true -Dfirstboot=false -Dbinfmt=false -Drandomseed=false -Dsysusers=false -Dtmpfiles=false -Dkernel-install=false -Defi=false -Didn=false -Dfuzz-tests=false -Dslow-tests=false" >> .packit_rpm/systemd.spec.new'
    - bash -c 'cat .packit_rpm/systemd.spec >> .packit_rpm/systemd.spec.new'
    - mv .packit_rpm/systemd.spec.new .packit_rpm/systemd.spec
    # Neutralize the %global ntpvendor shell-invocation that returns empty
    # in the copr mock chroot parse context, and the check that follows it.
    - bash -c 'sed -i "s|^%global ntpvendor %(source /etc/os-release.*|%global ntpvendor fedora|" .packit_rpm/systemd.spec'
    - bash -c 'sed -i "/%{!?ntpvendor:/d" .packit_rpm/systemd.spec'
    - bash -c 'sed -i "0,/^%build$/{//d;}" .packit_rpm/systemd.spec'
    - bash -c 'printf "%s\n" "" "%build" "%meson %{?meson_extra_configure_options}" "%__meson compile -C %{_vpath_builddir} %{?_smp_mflags} test-network test-resolved-link test-resolved-stream test-json test-loopback test-process-util test-netlink test-mountpoint-util test-namespace-util test-nsresource test-raw-clone test-sigbus test-socket-netlink test-terminal-util test-event" >> .packit_rpm/systemd.spec'
    - bash -c 'sed -i "0,/^%install$/{//d;}" .packit_rpm/systemd.spec'
    - bash -c 'printf "%s\n" "" "%install" "true" >> .packit_rpm/systemd.spec'
    - bash -c 'sed -i "0,/^%check$/{//d;}" .packit_rpm/systemd.spec'
    - bash -c 'printf "%s\n" "" "%check" "set +e" "%__meson test -C %{_vpath_builddir} --print-errorlogs --no-rebuild --timeout-multiplier 4 test-network test-resolved-link test-resolved-stream test-json test-loopback test-process-util test-netlink test-mountpoint-util test-namespace-util test-nsresource test-raw-clone test-sigbus test-socket-netlink test-terminal-util test-event" "rc=\$?" "cat %{_vpath_builddir}/meson-logs/testlog.txt 2>/dev/null || true" "exit \$rc" >> .packit_rpm/systemd.spec'

jobs:
- job: copr_build
  trigger: pull_request
  targets:
  - fedora-rawhide-s390x
